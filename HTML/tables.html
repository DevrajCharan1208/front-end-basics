<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table border="">
        <caption>Table in HTML</caption>
        <tr>
            <th rowspan="2">item</th>
            <th colspan="2">Price</th>
        </tr>
        <tr>
            <th>INR</th>
            <th>USD</th>
        </tr>
        <tr>
            <td>item-1</td>
            <td>80</td>
            <td>9.2</td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <ul>
        <h2>Unordered list </h2>
        <li>Food</li>
        <li>Stationary</li>
    </ul>
    <ol type="a">
        <h2>Ordered list </h2>
        <li>Food</li>
        <li>Stationary</li>
    </ol>
</body>
</html>
